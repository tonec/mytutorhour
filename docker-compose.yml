version: '3.8'

services:
  # Database container matching Coolify's PostgreSQL engine
  postgres:
    image: postgres:16-alpine
    container_name: nextjs_postgres_local
    environment:
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: local_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # S3-compatible Object Storage to mirror production buckets
  minio:
    image: minio/minio:latest
    container_name: nextjs_storage_local
    ports:
      - "9000:9000"       # S3 API port
      - "9001:9001"       # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
